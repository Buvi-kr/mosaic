<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별자리 조각 올리기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: white;
      overscroll-behavior-y: none;
    }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .cropper-container { max-height: 50vh; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="glass w-full max-w-md rounded-3xl p-6 shadow-2xl text-center">
    <div id="step-1">
      <h1 class="text-3xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">우주와 동기화</h1>
      <p class="text-gray-300 text-sm mb-6">자신의 얼굴이 선명하게 나온 사진을 선택해주세요.</p>
      
      <label class="block w-full border-2 border-dashed border-purple-500/50 rounded-2xl p-12 hover:bg-purple-500/20 transition-colors cursor-pointer">
        <svg class="mx-auto h-12 w-12 text-purple-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="text-purple-100 font-medium text-lg">사진 앨범 열기</span>
        <input type="file" id="photo" accept="image/*" class="hidden">
      </label>
    </div>

    <!-- 크롭 화면 -->
    <div id="step-2" class="hidden">
      <h2 class="text-xl font-bold mb-4">가장 잘 나온 영역 맞추기</h2>
      <div class="bg-black rounded-xl overflow-hidden mb-4">
        <img id="image-to-crop" src="" class="max-w-full">
      </div>
      <div class="flex gap-3">
        <button id="cancelBtn" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold">취소</button>
        <button id="cropBtn" class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 py-3 rounded-xl font-bold shadow-lg">이대로 전송🚀</button>
      </div>
    </div>

    <!-- 로딩 화면 -->
    <div id="step-3" class="hidden py-8">
      <div class="relative w-24 h-24 mx-auto mb-4">
        <div class="absolute inset-0 border-t-4 border-purple-500 border-solid rounded-full animate-spin"></div>
        <div class="absolute inset-2 border-r-4 border-indigo-400 border-solid rounded-full animate-[spin_1.5s_reverse_infinite]"></div>
      </div>
      <h3 class="text-xl font-bold text-indigo-300 animate-pulse">우주 데이터를 조합 중...</h3>
      <p id="queueStatus" class="text-sm text-gray-400 mt-2">잠시만 기다려주세요.</p>
    </div>

    <!-- 완료 화면 -->
    <div id="step-4" class="hidden py-6">
      <h3 class="text-2xl font-extrabold text-green-400 mb-2">동기화 완료!</h3>
      <p class="text-gray-300 mb-6">전방의 대형 스크린을 바라보세요.</p>
      <img id="resultImage" class="w-full rounded-xl shadow-lg border-2 border-white/10 mb-4" />
      <div class="flex flex-col gap-3">
        <a id="downloadBtn" href="#" download="my_cosmos_mosaic.jpg" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 py-3 rounded-xl font-bold shadow-lg text-center block">내 모자이크 다운로드 💾</a>
        <button onclick="location.reload()" class="w-full bg-white/10 hover:bg-white/20 py-3 rounded-xl font-bold">다른 사진 해보기</button>
      </div>
    </div>
  </div>

  <script>
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');
    const step4 = document.getElementById('step-4');
    
    const photoInput = document.getElementById('photo');
    const imageToCrop = document.getElementById('image-to-crop');
    const cancelBtn = document.getElementById('cancelBtn');
    const cropBtn = document.getElementById('cropBtn');
    let cropper = null;

    photoInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (files && files.length > 0) {
        const file = files[0];
        imageToCrop.src = URL.createObjectURL(file);
        
        step1.classList.add('hidden');
        step2.classList.remove('hidden');

        if(cropper) cropper.destroy();
        cropper = new Cropper(imageToCrop, {
          viewMode: 1,
          dragMode: 'none',
          autoCropArea: 0.8,
          restore: false,
          guides: true,
          center: true,
          highlight: false,
          cropBoxMovable: true,
          cropBoxResizable: true,
          toggleDragModeOnDblclick: false,
        });
      }
    });

    cancelBtn.addEventListener('click', () => {
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
      photoInput.value = '';
    });

    cropBtn.addEventListener('click', () => {
      if (!cropper) return;

      step2.classList.add('hidden');
      step3.classList.remove('hidden');

      const canvas = cropper.getCroppedCanvas({
        maxWidth: 4096,
        maxHeight: 4096,
      });

      if (!canvas) {
        alert('영역을 인식할 수 없습니다. 크롭 영역을 다시 한 번 터치해주세요!');
        step3.classList.add('hidden');
        step2.classList.remove('hidden');
        return;
      }

      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('photo', blob, 'user_cropped.jpg');

        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          
          step3.classList.add('hidden');
          if(data.success) {
            step4.classList.remove('hidden');
            document.getElementById('resultImage').src = data.imageUrl;
            document.getElementById('downloadBtn').href = data.imageUrl;
          } else {
            alert('오류: ' + data.error);
            step1.classList.remove('hidden');
          }
        } catch(e) {
          alert('서버와 통신할 수 없습니다.');
          location.reload();
        }
      }, 'image/jpeg', 0.9);
    });
  </script>
</body>
</html>
