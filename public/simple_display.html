<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVERSE COSMOS | 초대형 모자이크 전시관</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }

    /* 우주 별빛 앰비언트 캔버스 */
    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 메인 모자이크 뷰포트 (100% 꽉 채운 뷰포트) */
    .viewport-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 5;
      background: radial-gradient(circle at 50% 50%, #080a14 0%, #000000 100%);
    }

    /* 켄 번스 시네마틱 미세 줌 효과 */
    .ken-burns {
      animation: kenburns 18s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes kenburns {
      0% { transform: scale(1.0) translate(0, 0); }
      50% { transform: scale(1.05) translate(-1%, -1%); }
      100% { transform: scale(1.03) translate(1%, 0.5%); }
    }

    /* 초대형 전시 이미지 레이어 */
    .mosaic-image {
      max-width: 96vw;
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.95), 0 0 60px rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 신규 완성 시 극적인 빛 플래시 효과 */
    .reveal-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.6) 0%, rgba(59, 130, 246, 0.3) 50%, transparent 80%);
      opacity: 0;
      pointer-events: none;
      z-index: 25;
    }

    /* 플로팅 코너 QR HUD (사이버 글래스모피즘) */
    .floating-qr-hud {
      position: absolute;
      bottom: 28px;
      right: 28px;
      z-index: 30;
      background: rgba(10, 13, 26, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(129, 140, 248, 0.45);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(99, 102, 241, 0.35);
      border-radius: 26px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      width: 250px;
    }
    .floating-qr-hud:hover {
      border-color: rgba(168, 85, 247, 0.8);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.9), 0 0 45px rgba(168, 85, 247, 0.5);
    }

    /* 상단 미니멀 브랜드 헤더 */
    .minimal-brand-header {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    /* 실시간 네온 레이저 프로그레스 바 (하단 전체) */
    .laser-progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 40;
      overflow: hidden;
    }
    .laser-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7, #06b6d4, #10b981);
      box-shadow: 0 0 20px #06b6d4, 0 0 40px #a855f7;
      transition: width 0.35s ease-out;
    }

    /* 프로그레스 텍스트 토스트 */
    .progress-toast {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.3);
      padding: 10px 24px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity 0.3s, transform 0.3s;
    }

    /* 신규 완성작 안내 뱃지 (상단 중앙) */
    .showcase-badge {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(16, 185, 129, 0.18);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(16, 185, 129, 0.6);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(16, 185, 129, 0.35);
      padding: 8px 22px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
      100% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.6); }
    }
  </style>
</head>
<body>

  <!-- 우주 별빛 배경 캔버스 -->
  <canvas id="spaceCanvas"></canvas>

  <!-- 번쩍이는 플래시 오버레이 -->
  <div id="revealFlash" class="reveal-flash"></div>

  <!-- 상단 좌측: 미니멀 브랜드 헤더 -->
  <div class="minimal-brand-header">
    <div class="w-10 h-10 rounded-2xl bg-indigo-600/30 border border-indigo-400/50 flex items-center justify-center shadow-[0_0_20px_rgba(99,102,241,0.5)]">
      <span class="text-xl">🌌</span>
    </div>
    <div>
      <h1 class="text-lg lg:text-xl font-black font-outfit tracking-wider text-white uppercase flex items-center gap-2">
        REVERSE COSMOS
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 font-bold">MEGA EXHIBITION</span>
      </h1>
      <p class="text-xs text-slate-400 font-medium">수천 장의 우주 사진으로 완성되는 초대형 인터랙티브 모자이크</p>
    </div>
  </div>

  <!-- 상단 우측: 풀스크린 / HUD 토글 버튼 -->
  <div class="absolute top-6 right-8 z-30 flex items-center gap-3">
    <button id="toggleHudBtn" onclick="toggleHud()" class="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 border border-white/10 text-xs font-bold transition-all shadow-md flex items-center gap-1.5 backdrop-blur-md">
      <span id="hudIcon">👁️</span>
      <span id="hudText">QR 가리기</span>
    </button>
    <button onclick="toggleFullscreen()" class="px-3 py-1.5 rounded-xl bg-indigo-950/80 hover:bg-indigo-900 text-indigo-200 border border-indigo-500/30 text-xs font-bold font-mono transition-all shadow-md flex items-center gap-1.5 backdrop-blur-md">
      <span>⛶</span>
      <span>F11 전체화면</span>
    </button>
  </div>

  <!-- 신규 작품 완성 축하 뱃지 (기본 숨김) -->
  <div id="showcaseBadge" class="showcase-badge hidden">
    <span class="text-emerald-400 text-lg animate-bounce">✨</span>
    <span class="text-emerald-300 font-black text-sm tracking-tight" id="showcaseTitle">방금 완성된 관람객 모자이크 작품</span>
    <span id="showcaseTimerBadge" class="text-xs font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-200">20s</span>
  </div>

  <!-- ============================================================== -->
  <!-- 메인 모자이크 뷰포트 (전체화면 95%+)                                -->
  <!-- ============================================================== -->
  <div class="viewport-container" id="viewportContainer">
    <!-- 크로스페이드용 듀얼 이미지 엘리먼트 -->
    <img id="primaryImage" class="mosaic-image ken-burns" src="/output_guides/demo_cosmos_1.jpg" alt="Cosmos Mosaic View" onerror="handleImgError(this)">
    <img id="secondaryImage" class="mosaic-image ken-burns hidden absolute" src="" alt="Next Mosaic View" onerror="handleImgError(this)">
  </div>

  <!-- ============================================================== -->
  <!-- 우측 하단 플로팅 코너 QR HUD                                     -->
  <!-- ============================================================== -->
  <div id="floatingQrHud" class="floating-qr-hud">
    <!-- 상태 안내 타이틀 -->
    <div class="w-full flex items-center justify-between mb-2">
      <span class="text-xs font-black text-indigo-300 uppercase tracking-wider flex items-center gap-1">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        스마트 참여
      </span>
      <span class="text-[11px] font-mono text-slate-400">1-Touch</span>
    </div>

    <!-- QR 코드 영역 (OPEN 상태) -->
    <div id="qrOpenBox" class="flex flex-col items-center">
      <div class="p-2.5 rounded-2xl bg-white shadow-[0_0_30px_rgba(99,102,241,0.5)] border-2 border-indigo-400">
        <div id="qrcode" class="w-36 h-36 flex items-center justify-center">
          <span class="text-xs text-slate-400">QR 로딩 중...</span>
        </div>
      </div>
      <p class="text-xs font-extrabold text-white text-center mt-2.5 leading-snug">
        📱 휴대폰 기본 카메라로<br>
        <span class="text-cyan-300">QR을 스캔하세요</span>
      </p>
      <p class="text-[10px] text-slate-400 text-center mt-0.5">내 사진이 대형 스크린에 뜹니다</p>
    </div>

    <!-- 체험 진행 중 (BUSY 상태) -->
    <div id="qrBusyBox" class="hidden flex flex-col items-center py-2">
      <div class="w-14 h-14 rounded-full bg-rose-500/20 border-2 border-rose-400 flex items-center justify-center mb-2 shadow-[0_0_25px_rgba(244,63,94,0.4)]">
        <span class="text-2xl animate-pulse">📸</span>
      </div>
      <p class="text-sm font-black text-rose-300">체험 진행 중</p>
      <p class="text-xs text-slate-300 text-center mt-1 leading-tight">
        현재 관람객이 사진을<br>전송하고 있습니다.<br>
        <span class="text-amber-300 font-bold">잠시만 기다려주세요!</span>
      </p>
    </div>
  </div>

  <!-- ============================================================== -->
  <!-- 생성 중 프로그레스 알림 토스트 (하단 중앙)                          -->
  <!-- ============================================================== -->
  <div id="progressToast" class="progress-toast hidden">
    <div class="w-5 h-5 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
    <span id="progressToastMsg" class="text-sm font-bold text-white tracking-tight">수천 장의 우주 타일과 매칭 중...</span>
    <span id="progressToastPercent" class="text-sm font-black font-mono text-cyan-300">0%</span>
  </div>

  <!-- 하단 전체 네온 레이저 프로그레스 바 -->
  <div class="laser-progress-container">
    <div id="laserProgressBar" class="laser-progress-bar"></div>
  </div>

  <script>
    // ================================================================
    // 배경 우주 별빛 파티클 캔버스
    // ================================================================
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const STAR_COUNT = 90;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.6 + 0.4,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const time = Date.now() * 0.001;
      stars.forEach(s => {
        const currentAlpha = s.alpha * (0.6 + 0.4 * Math.sin(time * 2 + s.phase));
        ctx.fillStyle = `rgba(199, 210, 254, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(renderStars);
    }
    renderStars();

    // ================================================================
    // Socket.io & 게이트/QR 동기화
    // ================================================================
    const socket = io();
    let currentGateToken = '';
    let isGateOpen = true;

    function getSimpleUploadUrl() {
      const origin = window.location.origin;
      return `${origin}/simple_upload.html${currentGateToken ? '?gateToken=' + currentGateToken : ''}`;
    }

    function drawQR(url) {
      const qrEl = document.getElementById('qrcode');
      QRCode.toCanvas(document.createElement('canvas'), url, {
        width: 260,
        margin: 1,
        color: { dark: '#000000', light: '#ffffff' },
        errorCorrectionLevel: 'M'
      }, function (err, canvasEl) {
        if (!err && qrEl) {
          qrEl.innerHTML = '';
          canvasEl.style.width = '100%';
          canvasEl.style.height = '100%';
          canvasEl.style.borderRadius = '12px';
          qrEl.appendChild(canvasEl);
        }
      });
    }

    function updateGateDisplay(state) {
      if (!state) return;
      isGateOpen = state.isOpen;
      currentGateToken = state.gateToken || '';

      const qrOpenBox = document.getElementById('qrOpenBox');
      const qrBusyBox = document.getElementById('qrBusyBox');

      if (isGateOpen) {
        if (qrBusyBox) qrBusyBox.classList.add('hidden');
        if (qrOpenBox) qrOpenBox.classList.remove('hidden');
        drawQR(getSimpleUploadUrl());
      } else {
        if (qrOpenBox) qrOpenBox.classList.add('hidden');
        if (qrBusyBox) qrBusyBox.classList.remove('hidden');
      }
    }

    socket.on('gate_state', (state) => {
      console.log('[디스플레이] 게이트 상태 수신:', state);
      updateGateDisplay(state);
    });
    socket.emit('request_gate_state');

    // ================================================================
    // 모자이크 이미지 순환 갤러리 및 신규 완성 연출
    // ================================================================
    let recentMosaics = [];
    let guideMosaics = [];
    let currentGalleryIndex = 0;
    let idleCycleTimer = null;
    let isShowingNewMosaic = false;
    let showcaseCountdownTimer = null;

    const primaryImg = document.getElementById('primaryImage');
    const secondaryImg = document.getElementById('secondaryImage');

    function handleImgError(img) {
      // 이미지 로드 실패 시 데모 이미지로 부드럽게 폴백
      console.warn('이미지 로드 실패, 데모 이미지로 대체:', img.src);
      img.src = '/guides/guide_step3_result.png';
    }

    async function fetchGalleryList() {
      try {
        const [recentRes, guideRes] = await Promise.all([
          fetch('/api/outputs/recent').then(r => r.json()).catch(() => ({ outputs: [] })),
          fetch('/api/outputs/guides').then(r => r.json()).catch(() => ({ guides: [] }))
        ]);
        recentMosaics = (recentRes.outputs || []).map(o => o.imageUrl);
        guideMosaics = guideRes.guides || [];
      } catch (e) {
        console.error('갤러리 목록 로드 에러:', e);
      }
    }

    function getCombinedPlaylist() {
      const list = [...recentMosaics, ...guideMosaics];
      if (list.length === 0) {
        list.push('/guides/guide_step3_result.png');
      }
      return list;
    }

    function crossFadeTo(newSrc) {
      if (primaryImg.src.endsWith(newSrc)) return;

      secondaryImg.src = newSrc;
      secondaryImg.classList.remove('hidden');
      secondaryImg.style.opacity = '0';
      secondaryImg.style.transform = 'scale(0.98)';

      setTimeout(() => {
        secondaryImg.style.opacity = '1';
        secondaryImg.style.transform = 'scale(1)';
        primaryImg.style.opacity = '0';

        setTimeout(() => {
          primaryImg.src = newSrc;
          primaryImg.style.opacity = '1';
          secondaryImg.classList.add('hidden');
        }, 1200);
      }, 50);
    }

    function stepIdleCycle() {
      if (isShowingNewMosaic) return;
      const playlist = getCombinedPlaylist();
      if (playlist.length <= 1) return;

      currentGalleryIndex = (currentGalleryIndex + 1) % playlist.length;
      crossFadeTo(playlist[currentGalleryIndex]);
    }

    function startIdleCycle() {
      if (idleCycleTimer) clearInterval(idleCycleTimer);
      idleCycleTimer = setInterval(stepIdleCycle, 8000);
    }

    // ================================================================
    // 모자이크 완성 쇼케이스 큐 (FIFO: 시간순 순차 전시 보장)
    // ================================================================
    let showcaseQueue = [];

    function queueUserShowcase(data) {
      showcaseQueue.push(data);
      if (!isShowingNewMosaic) {
        processNextShowcase();
      }
    }

    function processNextShowcase() {
      if (showcaseQueue.length === 0) {
        isShowingNewMosaic = false;
        fetchGalleryList().then(() => startIdleCycle());
        return;
      }

      isShowingNewMosaic = true;
      if (idleCycleTimer) clearInterval(idleCycleTimer);
      if (showcaseCountdownTimer) clearInterval(showcaseCountdownTimer);

      const data = showcaseQueue.shift();

      // 1. 빛 플래시 파티클 연출
      const flash = document.getElementById('revealFlash');
      gsap.fromTo(flash, 
        { opacity: 0.9, scale: 0.8 }, 
        { opacity: 0, scale: 1.2, duration: 1.2, ease: "power2.out" }
      );

      // 2. 신규 모자이크 즉시 로드 및 스케일업 효과
      primaryImg.src = data.imageUrl;
      primaryImg.style.opacity = '1';
      gsap.fromTo(primaryImg,
        { scale: 0.92, filter: 'brightness(1.5)' },
        { scale: 1, filter: 'brightness(1)', duration: 1.4, ease: "power3.out" }
      );

      // 3. 상단 축하 뱃지 및 카운트다운 타이머
      const badge = document.getElementById('showcaseBadge');
      const timerBadge = document.getElementById('showcaseTimerBadge');
      const showcaseTitle = document.getElementById('showcaseTitle');
      
      let remainSec = Number(data.displayDuration) || 20;
      showcaseTitle.textContent = data.shotNumber === 2 
        ? '✨ 관람객의 2차 보너스 모자이크 작품' 
        : '🎉 방금 완성된 관람객 모자이크 작품';
      timerBadge.textContent = `${remainSec}s`;
      badge.classList.remove('hidden');

      showcaseCountdownTimer = setInterval(() => {
        remainSec--;
        if (remainSec > 0) {
          timerBadge.textContent = `${remainSec}s`;
        } else {
          clearInterval(showcaseCountdownTimer);
          badge.classList.add('hidden');
          // 다음 순번 사진 순차 전시
          processNextShowcase();
        }
      }, 1000);
    }

    // 신규 모자이크 완성 수신 시 쇼케이스 큐에 적재
    socket.on('new_mosaic', (data) => {
      console.log('🎉 [신규 모자이크 완성 수신]:', data);
      if (!data || !data.imageUrl) return;
      queueUserShowcase(data);
    });

    // ================================================================
    // 실시간 생성 진행률 (네온 레이저 바 & 토스트)
    // ================================================================
    const progressBar = document.getElementById('laserProgressBar');
    const progressToast = document.getElementById('progressToast');
    const toastMsg = document.getElementById('progressToastMsg');
    const toastPercent = document.getElementById('progressToastPercent');

    socket.on('display_state', (data) => {
      if (data.state === 'processing') {
        const percent = Math.min(100, Math.max(0, Math.round(data.percent || 0)));
        progressBar.style.width = `${percent}%`;
        progressToast.classList.remove('hidden');
        toastPercent.textContent = `${percent}%`;
      } else if (data.state === 'showcase' || data.state === 'idle') {
        progressBar.style.width = '0%';
        progressToast.classList.add('hidden');
      }
    });

    socket.on('mosaic_progress', (data) => {
      if (!data) return;
      progressToast.classList.remove('hidden');
      if (data.message) toastMsg.textContent = data.message;
      if (data.percent !== undefined) {
        const p = Math.round(data.percent);
        toastPercent.textContent = `${p}%`;
        progressBar.style.width = `${p}%`;
      }
      if (data.phase === 'done') {
        setTimeout(() => {
          progressToast.classList.add('hidden');
          progressBar.style.width = '0%';
        }, 1200);
      }
    });

    // ================================================================
    // UI 토글 & 전체화면 제어
    // ================================================================
    let isHudVisible = true;
    function toggleHud() {
      const hud = document.getElementById('floatingQrHud');
      const icon = document.getElementById('hudIcon');
      const text = document.getElementById('hudText');
      isHudVisible = !isHudVisible;

      if (isHudVisible) {
        hud.style.opacity = '1';
        hud.style.pointerEvents = 'auto';
        icon.textContent = '👁️';
        text.textContent = 'QR 가리기';
      } else {
        hud.style.opacity = '0';
        hud.style.pointerEvents = 'none';
        icon.textContent = '📱';
        text.textContent = 'QR 보이기';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'h' || e.key === 'H') toggleHud();
    });

    // 초기화 기동
    fetchGalleryList().then(() => {
      const playlist = getCombinedPlaylist();
      if (playlist.length > 0) {
        primaryImg.src = playlist[0];
      }
      startIdleCycle();
    });
  </script>
</body>
</html>
